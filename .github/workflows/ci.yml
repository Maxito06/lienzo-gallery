name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Una ejecución por rama: si llega un push nuevo, se cancela la anterior
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (build and unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      # El postinstall de la API ejecuta "prisma generate"; no hace falta un paso aparte.
      # prisma.config.ts usa una URL falsa por defecto si DIRECT_URL no existe, así que no se necesitan variables.
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Solo pruebas unitarias; las e2e necesitan base de datos y no se ejecutan aquí
      - name: Unit tests
        run: npm run test

  web:
    name: Web (unit tests and build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Las pruebas usan jsdom, no necesitan navegador
      - name: Unit tests
        run: npx ng test --watch=false

      - name: Build
        run: npx ng build

