<!-- Skip to content -->
<a class="skip-link" href="#contenido">Saltar al contenido</a>

<header>
  <a class="brand" routerLink="/">{{ brand.name }}</a>
  <nav aria-label="Principal">
    <!-- Gallery -->
    <a routerLink="/">Galería</a>
    @if (contactLink; as link) {
      <!-- Contact -->
      <a [href]="link" target="_blank" rel="noopener noreferrer">Contacto</a>
    }
  </nav>
</header>

<main id="contenido" tabindex="-1">
  <router-outlet />
</main>

<footer>
  <p>{{ brand.name }} · {{ brand.footerNote }}</p>
  <p>
    {{ brand.credits }} ·
    <!-- Source code on GitHub -->
    <a [href]="brand.githubUrl" target="_blank" rel="noopener noreferrer">{{ brand.githubLabel }}</a>
  </p>
</footer>
