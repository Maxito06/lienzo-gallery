<!-- Artwork detail (view artwork) -->
<a class="card" [routerLink]="['/obras', artwork().slug]">
  <div class="frame">
    @if (imageUrl(); as url) {
      <img
        [src]="url"
        [alt]="artwork().title || 'Obra sin título'"
        [attr.loading]="eager() ? 'eager' : 'lazy'"
        [attr.fetchpriority]="highPriority() ? 'high' : null"
      />
    } @else {
      <div class="no-image">Sin imagen</div>
    }
  </div>
  <div class="label">
    <h2>{{ artwork().title }}</h2>
    <p class="details">{{ details() }}</p>
    <p class="status" [attr.data-status]="artwork().status">{{ statusLabel() }}</p>
  </div>
</a>
