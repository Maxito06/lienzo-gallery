[build]
  command = "npm run build"
  publish = "dist/lienzo-web/browser"

[[plugins]]
  package = "@netlify/angular-runtime"

[[edge_functions]]
  path = "/api/*"
  function = "api-proxy"

# El .nvmrc (Node 24) está en la raíz del repositorio, no en apps/web, así que se fija aquí
[build.environment]
  NODE_VERSION = "24"
